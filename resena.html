<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Escribir reseña · Lumio</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
tailwind.config = { darkMode: "class", theme: { extend: { colors: { primary: "#f59e0b", "primary-dark": "#d97706", accent: "#1c1917", "background-light": "#fdfaf6", "background-dark": "#101922" }, fontFamily: { display: ["Inter", "sans-serif"] }, borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" } } } }
</script>
<link rel="stylesheet" href="assets/css/styles.css"/>
</head>
<body class="font-display bg-background-light">
<div id="appHeader"></div>

<main class="px-4 sm:px-6 lg:px-8 pt-6 pb-12 max-w-3xl mx-auto">
  <nav class="flex items-center gap-2 text-sm text-slate-500 mb-4">
    <a href="index.html" class="hover:text-primary">Inicio</a>
    <span class="material-symbols-outlined !text-base">chevron_right</span>
    <a id="bcProductLink" href="producto.html?id=1" class="hover:text-primary">Producto</a>
    <span class="material-symbols-outlined !text-base">chevron_right</span>
    <span class="text-slate-900 font-bold">Escribir reseña</span>
  </nav>

  <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mb-2">Escribe tu reseña</h1>
  <p class="text-slate-600 mb-6">Tu opinión ayuda a otros clientes a elegir mejor.</p>

  <!-- Producto a reseñar -->
  <div class="bg-white border border-slate-200 rounded-2xl p-4 mb-5 flex gap-4 items-center">
    <div id="productImage" class="size-20 rounded-xl overflow-hidden bg-slate-100 shrink-0"></div>
    <div class="flex-1 min-w-0">
      <p class="text-xs font-black uppercase text-slate-500">Producto</p>
      <a id="productName" href="producto.html?id=1" class="font-black text-base hover:text-primary line-clamp-1">—</a>
      <p id="productBrand" class="text-xs text-slate-500">—</p>
    </div>
  </div>

  <form id="reviewForm" class="bg-white border border-slate-200 rounded-2xl p-6 sm:p-8">
    <!-- Calificación -->
    <div class="mb-6">
      <label class="text-xs font-black uppercase text-slate-500 mb-2 block">Tu calificación</label>
      <div class="flex items-center gap-2" id="starPicker"></div>
      <p class="text-sm text-slate-500 mt-2" id="starLabel">Selecciona una calificación</p>
    </div>

    <!-- Título -->
    <div class="mb-5">
      <label class="text-xs font-black uppercase text-slate-500 mb-1 block">Título (opcional)</label>
      <input id="reviewTitle" type="text" placeholder="Ej: Excelente lámpara" class="w-full h-11 px-3 rounded-lg border-slate-200 focus:border-primary focus:ring-primary"/>
    </div>

    <!-- Comentario -->
    <div class="mb-5">
      <label class="text-xs font-black uppercase text-slate-500 mb-1 block">Tu comentario</label>
      <textarea id="reviewComment" required rows="6" placeholder="Cuéntanos qué te pareció el producto, calidad, acabado, iluminación, etc." class="w-full px-3 py-2 rounded-lg border-slate-200 focus:border-primary focus:ring-primary"></textarea>
      <p class="text-xs text-slate-400 mt-1" id="charCount">0 / 500 caracteres</p>
    </div>

    <!-- Recomendación -->
    <div class="mb-6">
      <label class="text-xs font-black uppercase text-slate-500 mb-2 block">¿Recomendarías este producto?</label>
      <div class="flex gap-2">
        <label class="flex-1 cursor-pointer">
          <input type="radio" name="recommend" value="yes" class="peer hidden" checked/>
          <div class="peer-checked:bg-green-100 peer-checked:border-green-600 peer-checked:text-green-700 border border-slate-200 rounded-lg p-3 text-center text-sm font-bold hover:bg-slate-50 flex items-center justify-center gap-2">
            <span class="material-symbols-outlined">thumb_up</span> Sí, lo recomiendo
          </div>
        </label>
        <label class="flex-1 cursor-pointer">
          <input type="radio" name="recommend" value="no" class="peer hidden"/>
          <div class="peer-checked:bg-red-100 peer-checked:border-red-600 peer-checked:text-red-700 border border-slate-200 rounded-lg p-3 text-center text-sm font-bold hover:bg-slate-50 flex items-center justify-center gap-2">
            <span class="material-symbols-outlined">thumb_down</span> No
          </div>
        </label>
      </div>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-3 pt-2 border-t border-slate-100">
      <a id="backLink" href="producto.html?id=1" class="text-sm text-slate-500 hover:text-primary inline-flex items-center gap-1">
        <span class="material-symbols-outlined !text-base">arrow_back</span> Volver al producto
      </a>
      <div class="flex gap-2">
        <button type="button" onclick="history.back()" class="h-11 px-5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-lg">Cancelar</button>
        <button type="submit" class="h-11 px-6 bg-primary hover:bg-primary-dark text-white font-bold rounded-lg flex items-center gap-2">
          <span class="material-symbols-outlined">send</span> Publicar reseña
        </button>
      </div>
    </div>
  </form>
</main>

<div id="appFooter"></div>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
renderHeader("");
renderFooter();

const params = new URLSearchParams(location.search);
const id = parseInt(params.get("id") || "1");
const product = PRODUCTS.find(p => p.id === id) || PRODUCTS[0];

// Pintar producto
document.getElementById("productImage").innerHTML = `<img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover"/>`;
document.getElementById("productName").textContent = product.name;
document.getElementById("productName").href = `producto.html?id=${product.id}`;
document.getElementById("productBrand").textContent = `Marca: ${product.brand} · Categoría: ${product.category}`;
document.getElementById("bcProductLink").href = `producto.html?id=${product.id}`;
document.getElementById("backLink").href = `producto.html?id=${product.id}`;

// Estrellas
let rating = 0;
const labels = ["Selecciona una calificación", "Muy malo", "Malo", "Regular", "Bueno", "Excelente"];

// Renderizar 5 estrellas
document.getElementById("starPicker").innerHTML = [1,2,3,4,5].map(n =>
  `<button type="button" data-value="${n}" class="star-btn material-symbols-outlined !text-4xl star-inactive">star</button>`
).join("");

function paintStars(r) {
  document.querySelectorAll("#starPicker .star-btn").forEach(b => {
    const v = parseInt(b.dataset.value);
    b.classList.toggle("star-active", v <= r);
    b.classList.toggle("star-inactive", v > r);
  });
  document.getElementById("starLabel").textContent = labels[r];
}
document.querySelectorAll("#starPicker .star-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    rating = parseInt(btn.dataset.value);
    paintStars(rating);
  });
  btn.addEventListener("mouseenter", () => paintStars(parseInt(btn.dataset.value)));
  btn.addEventListener("mouseleave", () => paintStars(rating));
});

// Contador
document.getElementById("reviewComment").addEventListener("input", e => {
  document.getElementById("charCount").textContent = `${e.target.value.length} / 500 caracteres`;
});

// Submit
document.getElementById("reviewForm").addEventListener("submit", e => {
  e.preventDefault();
  if (rating === 0) { toast("Selecciona una calificación", "error"); return; }
  toast("¡Reseña publicada! Gracias por tu opinión.", "check_circle");
  setTimeout(() => location.href = `producto.html?id=${product.id}`, 1500);
});
</script>
</body>
</html>
